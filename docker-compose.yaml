services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-toydb}
      POSTGRES_USER: ${DATABASE_USERNAME:-toyuser}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-toypass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-toyuser} -d ${DATABASE_NAME:-toydb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ -n "$$DATABASE_URL" ]; then
          /app/.venv/bin/alembic upgrade head
        fi
        exec /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql+asyncpg://${DATABASE_USERNAME:-toyuser}:${DATABASE_PASSWORD:-toypass}@postgres:5432/${DATABASE_NAME:-toydb}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-}
      DATABASE_SSL_ROOT_CERT: ${DATABASE_SSL_ROOT_CERT:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ORIGINS: http://localhost:5173

  client:
    build:
      context: ./app
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    entrypoint:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            location /assets/ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            location = /_health/ {
                return 200 "OK";
                add_header Content-Type text/plain;
            }

            location / {
                try_files $$uri $$uri/ /index.html;
                add_header Cache-Control "no-cache";
            }
        }
        EOF
        exec nginx -g 'daemon off;'
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
